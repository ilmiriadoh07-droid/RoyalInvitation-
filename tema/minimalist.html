<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimalist | RoyalInvite</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#f8f8f5;
    color:#202020;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.content{
    width:min(700px,100%);
}

.number{
    font-size:12px;
    letter-spacing:5px;
    color:#777;
}

h1{
    margin:30px 0;
    font-family:"Playfair Display",serif;
    font-size:75px;
    font-weight:400;
    line-height:1;
}

.line{
    width:35px;
    height:1px;
    background:#222;
    margin:35px auto;
}

.text{
    color:#777;
    font-size:12px;
    letter-spacing:2px;
}

.date{
    margin-top:25px;
    font-size:12px;
}

button{
    margin-top:40px;
    background:#202020;
    color:#fff;
    border:0;
    padding:15px 30px;
    font-size:10px;
    letter-spacing:3px;
}

@media(max-width:600px){
    h1{font-size:54px}
}
</style></head><body><section class="cover"><div class="content"><div class="number">01 — 12 — 2026</div><h1>
Hadi<br>
&<br>
Riya
</h1><div class="line"></div><div class="text">
OUR WEDDING DAY
</div><div class="date">
A new chapter begins.
</div><button>OPEN INVITATION</button>

</div></section></body>
</html>
