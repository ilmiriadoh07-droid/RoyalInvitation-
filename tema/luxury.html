<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxury | RoyalInvite</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#030303;
    color:#fff;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(
        ellipse at center,
        rgba(197,157,54,.18),
        transparent 45%
    ),
    #030303;
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border:1px solid rgba(212,175,55,.15);
    border-radius:50%;
}

.content{
    position:relative;
    z-index:2;
}

.label{
    color:#b99748;
    font-size:9px;
    letter-spacing:6px;
}

h1{
    margin:30px 0;
    font-family:"Cormorant Garamond",serif;
    font-size:82px;
    font-weight:400;
    line-height:.85;
    background:linear-gradient(
        120deg,
        #8d6b25,
        #f1d77a,
        #a67c29
    );
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    font-size:11px;
    letter-spacing:4px;
    color:#aaa;
}

button{
    margin-top:40px;
    padding:15px 35px;
    background:linear-gradient(
        120deg,
        #8d6b25,
        #d4af37
    );
    border:0;
    color:#080706;
    font-size:10px;
    letter-spacing:3px;
}

@media(max-width:600px){
    h1{font-size:57px}
}
</style></head><body><section class="cover"><div class="glow"></div><div class="content"><div class="label">
AN EXCLUSIVE CELEBRATION
</div><h1>
Hadi<br>
&<br>
Riya
</h1><div class="subtitle">
THE WEDDING
</div><button>
ENTER INVITATION
</button></div></section></body>
</html>
