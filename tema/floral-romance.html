<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Floral Romance | RoyalInvite</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:#fff7f5;
    color:#4b3437;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    text-align:center;
    background:
    radial-gradient(circle at 10% 15%,#e7b9bd 0,transparent 18%),
    radial-gradient(circle at 90% 85%,#e7c9ad 0,transparent 18%),
    #fff7f5;
}

.card{
    width:min(650px,100%);
    min-height:90vh;
    padding:70px 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:300px 300px 20px 20px;
    background:rgba(255,255,255,.65);
    border:1px solid #e6c6c5;
    box-shadow:0 20px 70px rgba(100,60,60,.12);
}

.content{
    width:100%;
}

.flower{
    font-size:42px;
    margin-bottom:20px;
}

.label{
    font-size:9px;
    letter-spacing:4px;
    color:#9d6d73;
}

h1{
    margin:25px 0;
    font-family:"Cormorant Garamond",serif;
    font-size:70px;
    font-weight:500;
    line-height:.9;
}

.quote{
    font-family:"Cormorant Garamond",serif;
    font-size:22px;
    color:#80666a;
}

.date{
    margin-top:30px;
    font-size:11px;
    letter-spacing:3px;
}

button{
    margin-top:35px;
    padding:14px 28px;
    border:1px solid #a77a80;
    background:#a77a80;
    color:white;
    font-size:10px;
    letter-spacing:2px;
}

@media(max-width:600px){
    h1{font-size:53px}
}
</style></head><body><section class="cover">
<div class="card"><div class="content"><div class="flower">❀</div><div class="label">THE WEDDING OF</div><h1>
Hadi<br>&<br>Riya
</h1><div class="quote">
Two hearts,<br>
one beautiful journey.
</div><div class="date">
24 DECEMBER 2026
</div><button>BUKA UNDANGAN</button>

</div></div>
</section></body>
</html>
