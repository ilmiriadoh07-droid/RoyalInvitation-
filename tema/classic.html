<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Classic | RoyalInvite</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#171614;
    color:#eee;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.frame{
    width:min(700px,100%);
    min-height:90vh;
    border:4px double #a99568;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
}

.content{
    max-width:500px;
}

.label{
    font-size:10px;
    letter-spacing:5px;
    color:#c4b58b;
}

h1{
    margin:30px 0;
    font-family:"Cormorant Garamond",serif;
    font-size:70px;
    font-weight:500;
}

.divider{
    color:#b5a16b;
    letter-spacing:8px;
}

.quote{
    margin-top:30px;
    font-family:"Cormorant Garamond",serif;
    font-size:21px;
    color:#bbb;
}

.date{
    margin-top:30px;
    font-size:11px;
    letter-spacing:4px;
}

button{
    margin-top:35px;
    padding:13px 28px;
    background:transparent;
    color:#c4b58b;
    border:1px solid #a99568;
    letter-spacing:2px;
    font-size:10px;
}

@media(max-width:600px){
    h1{font-size:52px}
}
</style></head><body><section class="cover"><div class="frame"><div class="content"><div class="label">
TOGETHER WITH THEIR FAMILIES
</div><h1>
Hadi<br>
&<br>
Riya
</h1><div class="divider">
✦ ✦ ✦
</div><div class="quote">
Invite you to celebrate<br>
their wedding day.
</div><div class="date">
24 DECEMBER 2026
</div><button>VIEW INVITATION</button>

</div></div></section></body>
</html>
