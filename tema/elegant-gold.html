<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegant Gold | RoyalInvite</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#f5f1e8;
    color:#28231c;
    font-family:Montserrat,sans-serif;
}

.cover{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.frame{
    width:min(700px,100%);
    min-height:85vh;
    border:1px solid #b99b5b;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:50px 25px;
}

.frame:before,
.frame:after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    border:1px solid #b99b5b;
}

.frame:before{
    top:-1px;
    left:-1px;
    border-right:0;
    border-bottom:0;
}

.frame:after{
    bottom:-1px;
    right:-1px;
    border-left:0;
    border-top:0;
}

.content{
    max-width:500px;
}

.label{
    font-size:10px;
    letter-spacing:5px;
    color:#9b7c3e;
}

h1{
    margin:25px 0;
    font-family:"Cormorant Garamond",serif;
    font-size:68px;
    font-weight:500;
    line-height:.9;
}

.divider{
    width:70px;
    height:1px;
    background:#b99b5b;
    margin:30px auto;
}

.text{
    font-family:"Cormorant Garamond",serif;
    font-size:22px;
    color:#665c4d;
}

.date{
    margin-top:25px;
    font-size:11px;
    letter-spacing:3px;
    color:#8d7444;
}

button{
    margin-top:35px;
    padding:14px 28px;
    border:1px solid #9b7c3e;
    background:transparent;
    color:#735c2f;
    letter-spacing:3px;
    font-size:10px;
}

@media(max-width:600px){
    h1{font-size:52px}
    .frame{min-height:90vh}
}
</style></head><body><section class="cover">
<div class="frame">
<div class="content"><div class="label">THE WEDDING OF</div><h1>
Hadi<br>&<br>Riya
</h1><div class="divider"></div><div class="text">
A beautiful beginning of<br>
a lifetime together.
</div><div class="date">
24 • 12 • 2026
</div><button>
BUKA UNDANGAN
</button></div>
</div>
</section></body>
</html>
